<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Progression{% endblock %} · Tekken 8 Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">T8 <span>Tracker</span></a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Tableau de bord</a>
      <a href="{{ url_for('match_list') }}">Matchs</a>
      <a href="{{ url_for('matchups') }}">Matchups</a>
      <a href="{{ url_for('import_page') }}">Importer</a>
      <a href="{{ url_for('profile') }}">Profil</a>
      <a class="btn" href="{{ url_for('match_new') }}">+ Match</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
