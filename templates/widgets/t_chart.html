{% if t_history|length > 1 %}
  <div class="chart-big"><canvas id="placementChart"></canvas></div>
  <p class="small muted">Classement relatif à chaque tournoi (top %) : plus la courbe monte, mieux tu finis.</p>
  <script>
    (() => {
      const pts = {{ t_history|tojson }};
      const el = document.getElementById('placementChart');
      if (!el || typeof Chart === 'undefined') return;
      const grid = { color: 'rgba(255,255,255,0.06)' };
      new Chart(el, {
        type: 'line',
        data: { labels: pts.map(p => p.date.slice(8, 10) + '/' + p.date.slice(5, 7) + '/' + p.date.slice(2, 4)),
                datasets: [{ data: pts.map(p => p.top), borderColor: '#3ecf7a', backgroundColor: 'rgba(62,207,122,0.12)',
                             fill: 'end', tension: 0.25, borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: '#3ecf7a' }] },
        options: {
          animation: false, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: {
            title: items => pts[items[0].dataIndex].name,
            label: item => { const p = pts[item.dataIndex]; return `${p.placement}e / ${p.entrants} (top ${p.top} %)`; } } } },
          scales: { x: { ticks: { color: '#8a93a6' }, grid },
                    y: { reverse: true, min: 0, max: 100, ticks: { color: '#8a93a6', callback: v => 'top ' + v + ' %' }, grid } },
        },
      });
    })();
  </script>
{% else %}<p class="muted small">Il faut au moins deux tournois pour tracer une évolution.</p>{% endif %}
